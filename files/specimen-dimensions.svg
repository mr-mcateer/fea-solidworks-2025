<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- Background -->
  <rect width="650" height="300" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#2D2D2D">Test Specimen Dimensions (ASTM D790 Proportions)</text>

  <!-- Main bar - isometric-ish view -->
  <!-- Top face -->
  <polygon points="100,120 500,120 530,100 130,100" fill="#E5E7EB" stroke="#374151" stroke-width="1.5"/>
  <!-- Front face -->
  <polygon points="100,120 500,120 500,155 100,155" fill="#D1D5DB" stroke="#374151" stroke-width="1.5"/>
  <!-- Right face -->
  <polygon points="500,120 530,100 530,135 500,155" fill="#9CA3AF" stroke="#374151" stroke-width="1.5"/>

  <!-- LENGTH dimension (top) -->
  <line x1="100" y1="80" x2="530" y2="80" stroke="#FF6B35" stroke-width="1.5"/>
  <line x1="100" y1="75" x2="100" y2="95" stroke="#FF6B35" stroke-width="1"/>
  <line x1="530" y1="75" x2="530" y2="95" stroke="#FF6B35" stroke-width="1"/>
  <!-- Arrowheads -->
  <polygon points="100,80 108,77 108,83" fill="#FF6B35"/>
  <polygon points="530,80 522,77 522,83" fill="#FF6B35"/>
  <rect x="270" y="68" width="90" height="20" rx="3" fill="white" stroke="#FF6B35" stroke-width="1"/>
  <text x="315" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B35">80 mm</text>

  <!-- WIDTH dimension (right side) -->
  <line x1="555" y1="100" x2="555" y2="135" stroke="#4A90D9" stroke-width="1.5"/>
  <line x1="548" y1="100" x2="565" y2="100" stroke="#4A90D9" stroke-width="1"/>
  <line x1="548" y1="135" x2="565" y2="135" stroke="#4A90D9" stroke-width="1"/>
  <polygon points="555,100 552,108 558,108" fill="#4A90D9"/>
  <polygon points="555,135 552,127 558,127" fill="#4A90D9"/>
  <rect x="568" y="107" width="70" height="20" rx="3" fill="white" stroke="#4A90D9" stroke-width="1"/>
  <text x="603" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#4A90D9">10 mm</text>
  <text x="603" y="133" text-anchor="middle" font-size="9" fill="#4A90D9">(width, b)</text>

  <!-- DEPTH dimension (front) -->
  <line x1="70" y1="120" x2="70" y2="155" stroke="#10B981" stroke-width="1.5"/>
  <line x1="63" y1="120" x2="80" y2="120" stroke="#10B981" stroke-width="1"/>
  <line x1="63" y1="155" x2="80" y2="155" stroke="#10B981" stroke-width="1"/>
  <polygon points="70,120 67,128 73,128" fill="#10B981"/>
  <polygon points="70,155 67,147 73,147" fill="#10B981"/>
  <rect x="15" y="128" width="52" height="20" rx="3" fill="white" stroke="#10B981" stroke-width="1"/>
  <text x="41" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#10B981">4 mm</text>
  <text x="41" y="152" text-anchor="middle" font-size="9" fill="#10B981">(depth, d)</text>

  <!-- Support span dimension (bottom) -->
  <!-- Support positions -->
  <polygon points="160,170 175,190 145,190" fill="#6B7280"/>
  <polygon points="440,170 455,190 425,190" fill="#6B7280"/>

  <!-- Span dimension line -->
  <line x1="160" y1="205" x2="440" y2="205" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="160" y1="198" x2="160" y2="212" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="440" y1="198" x2="440" y2="212" stroke="#2D2D2D" stroke-width="1"/>
  <polygon points="160,205 168,202 168,208" fill="#2D2D2D"/>
  <polygon points="440,205 432,202 432,208" fill="#2D2D2D"/>
  <rect x="255" y="193" width="90" height="20" rx="3" fill="white" stroke="#2D2D2D" stroke-width="1"/>
  <text x="300" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2D2D">64 mm</text>

  <text x="300" y="225" text-anchor="middle" font-size="11" fill="#6B7280">Support Span (L)</text>

  <!-- Properties table -->
  <rect x="100" y="245" width="450" height="45" fill="white" stroke="#E5E7EB" stroke-width="1" rx="4"/>

  <text x="175" y="263" text-anchor="middle" font-size="10" font-weight="600" fill="#6B7280">SPAN:DEPTH</text>
  <text x="175" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2D2D">16 : 1</text>

  <line x1="262" y1="252" x2="262" y2="283" stroke="#E5E7EB" stroke-width="1"/>

  <text x="340" y="263" text-anchor="middle" font-size="10" font-weight="600" fill="#6B7280">CROSS-SECTION</text>
  <text x="340" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2D2D">40 mm²</text>

  <line x1="420" y1="252" x2="420" y2="283" stroke="#E5E7EB" stroke-width="1"/>

  <text x="488" y="263" text-anchor="middle" font-size="10" font-weight="600" fill="#6B7280">STANDARD</text>
  <text x="488" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2D2D">ASTM D790</text>
</svg>