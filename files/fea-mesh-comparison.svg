<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">FEA Mesh Comparison</text>

  <!-- COARSE MESH (left) -->
  <text x="200" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#FF6B35">Coarse Mesh</text>
  <text x="200" y="82" text-anchor="middle" font-size="11" fill="#6B7280">Fewer elements = Faster solve</text>

  <!-- Coarse mesh bar outline -->
  <rect x="60" y="100" width="280" height="50" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" rx="2"/>

  <!-- Coarse mesh grid lines - vertical -->
  <line x1="130" y1="100" x2="130" y2="150" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="200" y1="100" x2="200" y2="150" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="270" y1="100" x2="270" y2="150" stroke="#9CA3AF" stroke-width="1"/>

  <!-- Coarse mesh grid lines - horizontal -->
  <line x1="60" y1="125" x2="340" y2="125" stroke="#9CA3AF" stroke-width="1"/>

  <!-- Coarse diagonal lines for triangulation -->
  <line x1="60" y1="100" x2="130" y2="125" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="130" y1="100" x2="60" y2="125" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="130" y1="100" x2="200" y2="125" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="200" y1="100" x2="130" y2="125" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="200" y1="100" x2="270" y2="125" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="270" y1="100" x2="200" y2="125" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="270" y1="100" x2="340" y2="125" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="340" y1="100" x2="270" y2="125" stroke="#9CA3AF" stroke-width="0.8"/>

  <line x1="60" y1="125" x2="130" y2="150" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="130" y1="125" x2="60" y2="150" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="130" y1="125" x2="200" y2="150" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="200" y1="125" x2="130" y2="150" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="200" y1="125" x2="270" y2="150" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="270" y1="125" x2="200" y2="150" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="270" y1="125" x2="340" y2="150" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="340" y1="125" x2="270" y2="150" stroke="#9CA3AF" stroke-width="0.8"/>

  <!-- Coarse element count -->
  <rect x="140" y="165" width="120" height="28" fill="#2D2D2D" rx="4"/>
  <text x="200" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="white">16 elements</text>

  <!-- FINE MESH (right) -->
  <text x="600" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#4A90D9">Fine Mesh</text>
  <text x="600" y="82" text-anchor="middle" font-size="11" fill="#6B7280">More elements = More accurate</text>

  <!-- Fine mesh bar outline -->
  <rect x="460" y="100" width="280" height="50" fill="#F3F4F6" stroke="#4A90D9" stroke-width="1.5" rx="2"/>

  <!-- Fine mesh grid - vertical (8 divisions) -->
  <line x1="495" y1="100" x2="495" y2="150" stroke="#4A90D9" stroke-width="0.6"/>
  <line x1="530" y1="100" x2="530" y2="150" stroke="#4A90D9" stroke-width="0.6"/>
  <line x1="565" y1="100" x2="565" y2="150" stroke="#4A90D9" stroke-width="0.6"/>
  <line x1="600" y1="100" x2="600" y2="150" stroke="#4A90D9" stroke-width="0.6"/>
  <line x1="635" y1="100" x2="635" y2="150" stroke="#4A90D9" stroke-width="0.6"/>
  <line x1="670" y1="100" x2="670" y2="150" stroke="#4A90D9" stroke-width="0.6"/>
  <line x1="705" y1="100" x2="705" y2="150" stroke="#4A90D9" stroke-width="0.6"/>

  <!-- Fine mesh grid - horizontal (4 divisions) -->
  <line x1="460" y1="112.5" x2="740" y2="112.5" stroke="#4A90D9" stroke-width="0.6"/>
  <line x1="460" y1="125" x2="740" y2="125" stroke="#4A90D9" stroke-width="0.6"/>
  <line x1="460" y1="137.5" x2="740" y2="137.5" stroke="#4A90D9" stroke-width="0.6"/>

  <!-- Fine mesh diagonal lines (selected, to suggest triangulation without being unreadable) -->
  <line x1="460" y1="100" x2="495" y2="112.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="495" y1="100" x2="530" y2="112.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="530" y1="100" x2="565" y2="112.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="565" y1="100" x2="600" y2="112.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="600" y1="100" x2="635" y2="112.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="635" y1="100" x2="670" y2="112.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="670" y1="100" x2="705" y2="112.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="705" y1="100" x2="740" y2="112.5" stroke="#4A90D9" stroke-width="0.4"/>

  <line x1="460" y1="112.5" x2="495" y2="125" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="495" y1="112.5" x2="530" y2="125" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="530" y1="112.5" x2="565" y2="125" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="565" y1="112.5" x2="600" y2="125" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="600" y1="112.5" x2="635" y2="125" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="635" y1="112.5" x2="670" y2="125" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="670" y1="112.5" x2="705" y2="125" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="705" y1="112.5" x2="740" y2="125" stroke="#4A90D9" stroke-width="0.4"/>

  <line x1="460" y1="125" x2="495" y2="137.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="495" y1="125" x2="530" y2="137.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="530" y1="125" x2="565" y2="137.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="565" y1="125" x2="600" y2="137.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="600" y1="125" x2="635" y2="137.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="635" y1="125" x2="670" y2="137.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="670" y1="125" x2="705" y2="137.5" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="705" y1="125" x2="740" y2="137.5" stroke="#4A90D9" stroke-width="0.4"/>

  <line x1="460" y1="137.5" x2="495" y2="150" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="495" y1="137.5" x2="530" y2="150" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="530" y1="137.5" x2="565" y2="150" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="565" y1="137.5" x2="600" y2="150" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="600" y1="137.5" x2="635" y2="150" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="635" y1="137.5" x2="670" y2="150" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="670" y1="137.5" x2="705" y2="150" stroke="#4A90D9" stroke-width="0.4"/>
  <line x1="705" y1="137.5" x2="740" y2="150" stroke="#4A90D9" stroke-width="0.4"/>

  <!-- Fine element count -->
  <rect x="540" y="165" width="120" height="28" fill="#4A90D9" rx="4"/>
  <text x="600" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="white">128 elements</text>

  <!-- Arrow between -->
  <text x="400" y="132" text-anchor="middle" font-size="24" fill="#9CA3AF">&rarr;</text>

  <!-- Bottom comparison section -->
  <rect x="40" y="210" width="720" height="170" fill="white" stroke="#E5E7EB" stroke-width="1" rx="6"/>

  <text x="400" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#2D2D2D">The Trade-Off</text>

  <!-- Coarse stats -->
  <rect x="70" y="255" width="300" height="105" fill="#FFF7ED" stroke="#FF6B35" stroke-width="1" rx="4"/>
  <text x="220" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B35">COARSE MESH</text>
  <text x="220" y="298" text-anchor="middle" font-size="11" fill="#2D2D2D">Solve time: ~2 seconds</text>
  <text x="220" y="316" text-anchor="middle" font-size="11" fill="#2D2D2D">Max stress: 18.3 MPa</text>
  <text x="220" y="334" text-anchor="middle" font-size="11" fill="#2D2D2D">Accuracy: Approximate</text>
  <text x="220" y="352" text-anchor="middle" font-size="10" fill="#6B7280">Good for quick checks</text>

  <!-- Fine stats -->
  <rect x="430" y="255" width="300" height="105" fill="#EFF6FF" stroke="#4A90D9" stroke-width="1" rx="4"/>
  <text x="580" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#4A90D9">FINE MESH</text>
  <text x="580" y="298" text-anchor="middle" font-size="11" fill="#2D2D2D">Solve time: ~45 seconds</text>
  <text x="580" y="316" text-anchor="middle" font-size="11" fill="#2D2D2D">Max stress: 21.7 MPa</text>
  <text x="580" y="334" text-anchor="middle" font-size="11" fill="#2D2D2D">Accuracy: Converged</text>
  <text x="580" y="352" text-anchor="middle" font-size="10" fill="#6B7280">Use for final results</text>

  <!-- Footer -->
  <text x="400" y="395" text-anchor="middle" font-size="10" fill="#9CA3AF">If halving element size changes max stress by &lt;5%, the mesh has converged.</text>
</svg>