<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="fosGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="20%" stop-color="#EF4444"/>
      <stop offset="35%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="fosBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="20%" stop-color="#34D399"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="65%" stop-color="#FDE047"/>
      <stop offset="80%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <rect width="700" height="320" fill="#FAFAFA" rx="8"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2D2D2D">Factor of Safety Plot — Three-Point Bend</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#6B7280">Red = predicted failure (FoS &lt; 1.0) | Blue = safe (FoS &gt; 2.0)</text>

  <!-- Support triangles -->
  <polygon points="110,200 125,220 95,220" fill="#6B7280"/>
  <polygon points="530,200 545,220 515,220" fill="#6B7280"/>

  <!-- The bar with FoS gradient -->
  <rect x="80" y="150" width="480" height="50" rx="3" fill="url(#fosBar)" stroke="#374151" stroke-width="1.5"/>

  <!-- Center region overlay (lower FoS = orange/yellow) -->
  <rect x="270" y="150" width="100" height="50" rx="0" fill="#F97316" opacity="0.5"/>
  <rect x="295" y="150" width="50" height="50" rx="0" fill="#EF4444" opacity="0.4"/>

  <!-- Force arrow -->
  <line x1="320" y1="100" x2="320" y2="145" stroke="#2D2D2D" stroke-width="2"/>
  <polygon points="320,148 314,138 326,138" fill="#2D2D2D"/>
  <text x="320" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#2D2D2D">F = 50 N</text>

  <!-- Min FoS callout -->
  <line x1="320" y1="205" x2="430" y2="248" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="390" y="238" width="200" height="42" fill="white" stroke="#EF4444" stroke-width="1.5" rx="4"/>
  <text x="490" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">Min FoS: 1.67</text>
  <text x="490" y="272" text-anchor="middle" font-size="10" fill="#6B7280">At center — weakest location</text>

  <!-- Safe region callout -->
  <line x1="130" y1="170" x2="80" y2="248" stroke="#1E40AF" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="25" y="238" width="180" height="42" fill="white" stroke="#1E40AF" stroke-width="1.5" rx="4"/>
  <text x="115" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">FoS: 5.0+</text>
  <text x="115" y="272" text-anchor="middle" font-size="10" fill="#6B7280">Near supports — very safe</text>

  <!-- Legend bar -->
  <rect x="160" y="296" width="320" height="14" rx="3" fill="url(#fosGrad)"/>
  <text x="155" y="307" text-anchor="end" font-size="9" font-weight="600" fill="#991B1B">&lt;1.0</text>
  <text x="485" y="307" text-anchor="start" font-size="9" font-weight="600" fill="#1E40AF">&gt;5.0</text>
  <text x="320" y="307" text-anchor="middle" font-size="9" font-weight="600" fill="#6B7280">Factor of Safety</text>
</svg>