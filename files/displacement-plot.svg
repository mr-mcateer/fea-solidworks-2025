<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="dispGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="25%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="dispBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="25%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="75%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <rect width="700" height="320" fill="#FAFAFA" rx="8"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2D2D2D">Displacement Plot — Three-Point Bend</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#6B7280">Color shows how far each point moves from its original position</text>

  <!-- Original position (ghost) -->
  <rect x="80" y="110" width="480" height="50" rx="2" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="575" y="140" font-size="10" fill="#9CA3AF" font-style="italic">Original position</text>

  <!-- Deformed bar (exaggerated curve downward at center) -->
  <path d="M 80,112 Q 320,175 560,112 L 560,162 Q 320,225 80,162 Z" fill="url(#dispBar)" stroke="#374151" stroke-width="1.5"/>

  <!-- Support triangles -->
  <polygon points="110,170 125,190 95,190" fill="#6B7280"/>
  <polygon points="530,170 545,190 515,190" fill="#6B7280"/>

  <!-- Displacement arrow at center -->
  <line x1="320" y1="135" x2="320" y2="185" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="320,188 316,180 324,180" fill="#EF4444"/>

  <!-- Max displacement callout -->
  <rect x="350" y="182" width="210" height="38" fill="white" stroke="#EF4444" stroke-width="1.5" rx="4"/>
  <text x="455" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">Max displacement: 0.08 mm</text>
  <text x="455" y="212" text-anchor="middle" font-size="10" fill="#6B7280">At center (midspan)</text>

  <!-- Warning box -->
  <rect x="80" y="240" width="480" height="42" fill="#FEF2F2" stroke="#EF4444" stroke-width="1" rx="4"/>
  <text x="320" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">VISUAL EXAGGERATION WARNING</text>
  <text x="320" y="274" text-anchor="middle" font-size="10" fill="#374151">This curve looks dramatic, but actual displacement is only 0.08 mm. Read the numbers, not the picture.</text>

  <!-- Legend bar -->
  <rect x="190" y="296" width="260" height="12" rx="3" fill="url(#dispGrad)"/>
  <text x="185" y="306" text-anchor="end" font-size="9" font-weight="600" fill="#1E40AF">0 mm</text>
  <text x="455" y="306" text-anchor="start" font-size="9" font-weight="600" fill="#EF4444">0.08 mm</text>
</svg>