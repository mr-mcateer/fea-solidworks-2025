<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="stressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="15%" stop-color="#3B82F6"/>
      <stop offset="30%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#FDE047"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="90%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="barStress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="20%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#34D399"/>
      <stop offset="80%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="barStressV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="350" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="350" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#2D2D2D">Von Mises Stress Plot — Three-Point Bend</text>
  <text x="350" y="50" text-anchor="middle" font-size="11" fill="#6B7280">Color shows stress intensity at every point on the part</text>

  <!-- Support triangles -->
  <polygon points="110,220 125,240 95,240" fill="#6B7280"/>
  <polygon points="530,220 545,240 515,240" fill="#6B7280"/>

  <!-- The bar with stress gradient -->
  <rect x="80" y="170" width="480" height="50" rx="3" fill="url(#barStress)" stroke="#374151" stroke-width="1.5"/>

  <!-- Top surface stress variation (darker red at center top) -->
  <rect x="280" y="170" width="80" height="12" rx="2" fill="#DC2626" opacity="0.7"/>
  <rect x="250" y="170" width="140" height="8" rx="2" fill="#EF4444" opacity="0.4"/>

  <!-- Bottom surface stress variation (darker red at center bottom) -->
  <rect x="280" y="208" width="80" height="12" rx="2" fill="#DC2626" opacity="0.7"/>
  <rect x="250" y="212" width="140" height="8" rx="2" fill="#EF4444" opacity="0.4"/>

  <!-- Neutral axis (low stress in middle) -->
  <rect x="80" y="190" width="480" height="10" rx="0" fill="#34D399" opacity="0.3"/>

  <!-- Force arrow -->
  <line x1="320" y1="110" x2="320" y2="165" stroke="#2D2D2D" stroke-width="2.5"/>
  <polygon points="320,168 314,155 326,155" fill="#2D2D2D"/>
  <text x="320" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2D2D">F = 50 N</text>

  <!-- Fixed support markers -->
  <line x1="90" y1="240" x2="150" y2="240" stroke="#6B7280" stroke-width="2"/>
  <line x1="90" y1="240" x2="90" y2="248" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="105" y1="240" x2="100" y2="248" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="120" y1="240" x2="115" y2="248" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="135" y1="240" x2="130" y2="248" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="150" y1="240" x2="145" y2="248" stroke="#6B7280" stroke-width="1.5"/>

  <line x1="510" y1="240" x2="570" y2="240" stroke="#6B7280" stroke-width="2"/>
  <line x1="510" y1="240" x2="510" y2="248" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="525" y1="240" x2="520" y2="248" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="540" y1="240" x2="535" y2="248" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="555" y1="240" x2="550" y2="248" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="570" y1="240" x2="565" y2="248" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Max stress callout -->
  <line x1="320" y1="225" x2="420" y2="270" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="380" y="260" width="190" height="42" fill="white" stroke="#EF4444" stroke-width="1.5" rx="4"/>
  <text x="475" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">Max Von Mises: 24.0 MPa</text>
  <text x="475" y="294" text-anchor="middle" font-size="10" fill="#6B7280">At center, top &amp; bottom surfaces</text>

  <!-- Min stress callout -->
  <line x1="80" y1="195" x2="55" y2="270" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="15" y="260" width="155" height="42" fill="white" stroke="#3B82F6" stroke-width="1.5" rx="4"/>
  <text x="92" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#3B82F6">Min: ~0 MPa</text>
  <text x="92" y="294" text-anchor="middle" font-size="10" fill="#6B7280">At supports, neutral axis</text>

  <!-- Legend bar -->
  <rect x="160" y="318" width="320" height="14" rx="3" fill="url(#stressGrad)"/>
  <text x="155" y="330" text-anchor="end" font-size="10" font-weight="600" fill="#1E40AF">0</text>
  <text x="485" y="330" text-anchor="start" font-size="10" font-weight="600" fill="#991B1B">24 MPa</text>
  <text x="320" y="345" text-anchor="middle" font-size="9" fill="#6B7280">Von Mises Stress (MPa)</text>
</svg>